name: Automated Supabase DB Backup to GitHub Vault

on:
  schedule:
    # Run daily at 02:00 AM UTC (07:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Axios & Dependencies
        run: npm install axios

      - name: Extract Database Snapshot from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e '
          const axios = require("axios");
          const fs = require("fs");
          const path = require("path");

          const url = process.env.SUPABASE_URL || "https://uejeoznlhfqsyknoleib.supabase.co";
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;

          if (!key) {
            console.error("Missing SUPABASE_SERVICE_ROLE_KEY");
            process.exit(1);
          }

          const headers = {
            apikey: key,
            Authorization: `Bearer ${key}`
          };

          async function backup() {
            const tables = ["crm_tenants", "crm_leads", "crm_messages", "crm_billing_ledger", "crm_audit_logs"];
            const backupDir = path.join(process.cwd(), "data_backups");
            if (!fs.existsSync(backupDir)) fs.mkdirSync(backupDir, { recursive: true });

            const today = new Date().toISOString().slice(0, 10);
            const dump = { backup_date: today, tables: {} };

            for (const t of tables) {
              try {
                console.log(`Exporting table ${t}...`);
                const res = await axios.get(`${url}/rest/v1/${t}?limit=10000`, { headers, timeout: 15000 });
                dump.tables[t] = res.data;
              } catch (err) {
                console.error(`Failed to export ${t}:`, err.message);
              }
            }

            const filePath = path.join(backupDir, `snapshot_${today}.json`);
            fs.writeFileSync(filePath, JSON.stringify(dump, null, 2));
            console.log(`✅ Snapshot successfully saved to ${filePath}`);
          }
          backup();
          '

      - name: Commit and Push Snapshot to GitHub
        run: |
          git config --global user.name "Breeze DB Vault"
          git config --global user.email "bot@breeze-crm.com"
          git add data_backups/
          git commit -m "chore(backup): automated Supabase DB snapshot $(date +'%Y-%m-%d')" || exit 0
          git push origin main
